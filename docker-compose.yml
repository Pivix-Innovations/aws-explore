services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aws-explore-web
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      DJANGO_DEBUG: "False"
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5455
      POSTGRES_DB: aws_explore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: aws-explore-db
    command: ["postgres", "-p", "5455"]
    environment:
      POSTGRES_DB: aws_explore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5455:5455"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aws_explore -p 5455"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
